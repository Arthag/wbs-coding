<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
    <style>
        body {
            background: radial-gradient(#94c5eb, #fcfeff);
        }

        table {
            padding: 0em;
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            border-spacing: 0px;
        }

        th {
            background: linear-gradient(to right, #0c2568, #accef3);
            color: #FFFFFF;
            text-align: start;
            padding-left: 1em;  
        }

        tr {
            background-color: #c0c0c0;
        }

        td {
            padding: 10px;    
        }

        button{
            padding: 5px;
            background-color: #C0C0C0;
            font-weight: bold;
            border-top-color: #FFFFFF;
            border-left-color: #FFFFFF;
            
        }

        .boxfooter{
            text-align: right;
        }

        .window {
            padding: 10px;
            width: 50%;
            height: 240px;
        }

        .border {
            border: 2px solid #000000;
            border-top-color: #FFFFFF;
            border-left-color: #FFFFFF;
            border-radius: 4px;
            margin: 10px;
        }

    </style>
</head>

<body>
    <div class="window">
        <div class="border">
            <table>
                <thead>
                    <th colspan="2">Kernel Panic</th>
                </thead>
                <tbody>
                    <tr>
                        <td><img src="https://i.postimg.cc/wTQJ3hgb/error.png" width="20" height="20" alt="" /></td>
                        <td>Please shut down your computer, and go for a walk.</td>
                    </tr>
                    <tr>
                        <td colspan="2" class="boxfooter"><button>Cancel</button></td>
                    </tr>
                </tbody>
            </table>
            
        </div>

    </div>
</body>

</html>
