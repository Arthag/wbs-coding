<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="../styles.css" />
</head>
<body>
    <nav>
        <ul>
            <li><a href="../../index.html">Home</a></li>
            <li><a href="./about.html">About us</a></li>
            <li><a href="./contact.html">Contact</a></li>
        </ul>
    </nav> 
    <section class="contact">
        <h1>Contact Us</h1>
        <address>
            <ul>
                <li>Email: <a href="mailto:fairytail@fantasy-coffee.de" title="Mail to me">fairytail@fantasy-coffee.de</a></li>
                <li>Phone: <a href="tel:+49123456789">+49 123 456789</a></li>
                <li>Address: Fantasy Coffee<br/> Fogwood 1<br/>77777 Fairywood</li>
            </ul>
        </address>
        <form action="#" method="post">
            <p>
                <label for="name">Your name</label>
                <input type="text" id="name" name="name" required>
            </p><p>
                <label for="email">Your email</label>
                <input type="email" id="email" name="email" required>
            </p><p>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </p><p>
                <button type="submit">Send</button>
            </p>
        </form>
    </section>
    <figure>
        <img src="https://images.pexels.com/photos/9170244/pexels-photo-9170244.jpeg" alt="Wallace Chuck" width="100%" />
        <figcaption>Picture from Wallace Chuck on Pexels</figcaption>    
    </figure>
